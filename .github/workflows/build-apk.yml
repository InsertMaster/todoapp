name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 安装依赖
        run: npm ci

      - name: 构建 Web 应用
        run: npm run build

      - name: 安装 Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 设置 Android SDK
        run: |
          mkdir -p $HOME/android-sdk/cmdline-tools
          cd $HOME/android-sdk/cmdline-tools
          curl -sL -o cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdline-tools.zip
          mv cmdline-tools latest
          yes | $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses
          $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: 同步 Capacitor
        run: npx cap sync android
        env:
          ANDROID_HOME: ${{ runner.temp }}/android-sdk

      - name: 赋予 Gradle 执行权限
        run: chmod +x android/gradlew

      - name: 构建 APK
        working-directory: android
        run: ./gradlew assembleDebug
        env:
          ANDROID_HOME: ${{ runner.temp }}/android-sdk

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: 江湖任务录
          path: android/app/build/outputs/apk/debug/app-debug.apk
